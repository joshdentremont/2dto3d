# Runs 2D to 3D behind Traefik. Copy .env.example to .env and set APP_HOST.
# On its own, this file joins a Traefik you already run (through its existing network).
# To run the bundled Traefik too, enable docker-compose.traefik.yml from .env.
services:
  2d-to-3d:
    build: .
    image: 2d-to-3d:latest
    container_name: 2d-to-3d
    restart: unless-stopped
    # Hardening: nothing in the container can change its files or gain privileges. nginx
    # starts as root to bind port 80, so it keeps only the abilities it needs for that and
    # for handing over to its worker user. The tmpfs folders are the only places it writes.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.2d-to-3d.rule=Host(`${APP_HOST:?Set APP_HOST in .env}`)"
      - "traefik.http.routers.2d-to-3d.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.2d-to-3d.tls=true"
      - "traefik.http.routers.2d-to-3d.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.2d-to-3d.middlewares=2d-to-3d-hsts"
      - "traefik.http.middlewares.2d-to-3d-hsts.headers.stsSeconds=31536000"
      - "traefik.http.services.2d-to-3d.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
