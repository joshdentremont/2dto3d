# Runs Logo to 3D behind Traefik: either one you already run, or the bundled one below.
# Copy .env.example to .env and set APP_HOST. To use the bundled Traefik, also set
# COMPOSE_PROFILES=traefik in .env.
services:
  logo-to-3d:
    build: .
    image: logo-to-3d:latest
    container_name: logo-to-3d
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.logo-to-3d.rule=Host(`${APP_HOST:?Set APP_HOST in .env}`)"
      - "traefik.http.routers.logo-to-3d.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.logo-to-3d.tls=true"
      - "traefik.http.routers.logo-to-3d.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.logo-to-3d.loadbalancer.server.port=80"

  # Optional Traefik, started only when COMPOSE_PROFILES=traefik. It uses the same
  # entrypoint and certificate resolver names as the labels above.
  traefik:
    image: traefik:v3.7
    container_name: traefik
    profiles: ["traefik"]
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.${TRAEFIK_ENTRYPOINT:-websecure}.address=:443"
      - "--certificatesresolvers.${TRAEFIK_CERTRESOLVER:-letsencrypt}.acme.email=${ACME_EMAIL:-}"
      - "--certificatesresolvers.${TRAEFIK_CERTRESOLVER:-letsencrypt}.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.${TRAEFIK_CERTRESOLVER:-letsencrypt}.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  letsencrypt:
